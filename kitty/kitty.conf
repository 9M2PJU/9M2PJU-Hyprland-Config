# ==============================================================================
# Kitty Terminal Configuration
# Tuned for Lenovo ThinkPad T460 (CachyOS / KDE Wayland / Intel HD 520)
# ==============================================================================

# --- Font & Typography ---
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Aesthetics ---
window_padding_width 6 8
hide_window_decorations no
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  900
initial_window_height 550

# Subtle Wayland Transparency & Blur
background_opacity 0.95
background_blur 1

# Window borders & split styling
enabled_layouts splits,stack,tall,fat,grid
# active_border_color #5294e2
# inactive_border_color #2c3038
window_border_width 1.5pt
draw_minimal_borders yes

# --- Cursor & Smooth Animations ---
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- Performance & Latency ---
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- Audio & Bell ---
enable_audio_bell no
visual_bell_duration 0.0

# --- Scrollback Buffer ---
scrollback_lines 10000
scrollback_pager_history_size 256

# --- Tabs & Bar Style ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold

# --- Mouse & URLs ---
url_style curly
open_url_with default
detect_urls yes
copy_on_select yes

# --- Keybindings (Quality of Life) ---
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizing
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tabs management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Splits / Window Panes
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+- launch --location=hsplit --cwd=current
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# --- Hints Kitten (Copy / Open from Screen) ---
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>u kitten hints --type url --program @
map ctrl+shift+p>h kitten hints --type hash --program @
map ctrl+shift+p>w kitten hints --type word --program @

# Word navigation & deletion
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd
map ctrl+left send_text all \x1bb
map ctrl+right send_text all \x1bf

# Reload configuration on the fly
map ctrl+shift+f5 load_config_file

# --- Shell Integration ---
shell_integration enabled

# BEGIN_KITTY_THEME
# Default
include current-theme.conf
# END_KITTY_THEME