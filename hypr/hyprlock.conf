# Hyprlock Configuration for ThinkPad T460 (CachyOS)
# Minimalist Dark Theme (Zero Blur / Fast & Clean)

$font = Fantasque Sans Mono, CaskaydiaCove Nerd Font, Monospace

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
    immediate_render = true
}

# Solid Minimalist Dark Background (Zero GPU strain / Instant wake)
background {
    monitor =
    color = rgb(15, 17, 23)
}

# TIME (12-hour AM/PM)
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(236, 239, 244, 0.95)
    font_size = 75
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(147, 153, 178, 0.85)
    font_size = 18
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(122, 162, 247, 0.4)
    inner_color = rgb(22, 24, 33)
    font_color = rgb(236, 239, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 14
    check_color = rgb(122, 162, 247)
    fail_color = rgb(247, 118, 142)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>
    fail_transition = 200
    position = 0, -50
    halign = center
    valign = center
}

# USER BADGE
label {
    monitor =
    text = 󰌾  $USER
    color = rgba(122, 162, 247, 0.8)
    font_size = 14
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}
