# Hyprlock Configuration for ThinkPad T460 (CachyOS)
# Minimal, fast lock screen with blurred desktop background

$font = Fantasque Sans Mono, MesloLGS NF, Monospace

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(59, 66, 82, 0.8)
    inner_color = rgba(46, 52, 64, 0.8)
    font_color = rgb(236, 239, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##d8dee9">Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgb(163, 190, 140)
    fail_color = rgb(191, 97, 106)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    position = 0, -50
    halign = center
    valign = center
}

# TIME (12-hour AM/PM)
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(236, 239, 244, 0.95)
    font_size = 75
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(216, 222, 233, 0.85)
    font_size = 20
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 2
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.7)
    font_size = 14
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}
