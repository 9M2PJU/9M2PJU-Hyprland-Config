# #######################################################################################
# Lenovo ThinkPad T460 - Hyprland Configuration (CachyOS)
# Tuned for Intel HD 520 + Dual Monitors (HDMI-A-2 + eDP-1)
# #######################################################################################

################
### MONITORS ###
################
# Layout matches current kscreen geometry:
# Laptop screen (eDP-1) on the left (0,0), External HDMI (HDMI-A-2) on the right (1366,0)
monitor = eDP-1, 1366x768@60, 0x0, 1
monitor = HDMI-A-2, 1920x1080@100, 1366x0, 1
monitor = , preferred, auto, 1

##################
### WORKSPACES ###
##################
workspace = 1, monitor:eDP-1, default:true, persistent:true
workspace = 2, monitor:HDMI-A-2, default:true, persistent:true
workspace = 3, monitor:HDMI-A-2, persistent:true
workspace = 4, monitor:HDMI-A-2, persistent:true

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = dolphin
$menu = pkill -x nwg-drawer || nwg-drawer -c 7 -is 56 -term kitty -fm dolphin -ovl

#################
### AUTOSTART ###
#################
exec-once = ~/.config/waybar/launch-waybar.sh &
exec-once = ~/.config/hypr/scripts/launch-swaync.sh &
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = nm-applet --indicator &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = hypridle &
exec-once = swaybg -c '#1a1b26' &

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Tokyonight-Dark
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = XDG_MENU_PREFIX,plasma-

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.98

    # Performance optimization for Intel HD 520:
    # Disable heavy shadow and blur passes to keep GPU utilization minimal and smooth
    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 2, easeOutQuint, popin 87%
    animation = fade, 1, 2, quick
    animation = workspaces, 1, 2, easeOutQuint
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    scroll_factor = 2.0
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 1.0
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Applications & Actions
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, exec, google-chrome-stable
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, exec, bash ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, L, exec, hyprlock

# Window Switching (Instant Alt+Tab & Super+Tab across all monitors & workspaces)
bind = ALT, TAB, exec, bash ~/.config/hypr/scripts/window-switch-next.sh
bind = ALT SHIFT, TAB, exec, bash ~/.config/hypr/scripts/window-switch-prev.sh
bind = $mainMod, TAB, exec, bash ~/.config/hypr/scripts/window-switch-next.sh
bind = $mainMod SHIFT, TAB, exec, bash ~/.config/hypr/scripts/window-switch-prev.sh

# Screenshots (Saves to ~/Pictures/Screenshots & copies to clipboard)
bind = , Print, exec, bash ~/.config/hypr/scripts/screenshot.sh full
bind = $mainMod SHIFT, S, exec, bash ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/scripts/screenshot.sh window

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio & Brightness keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media Player controls
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
