# Hypridle Configuration for ThinkPad T460 (CachyOS)
# Manages idle dimming, screen locking, DPMS off, and suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 1. Dim screen to 50% after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = brightnessctl -sd intel_backlight set 50%
    on-resume = brightnessctl -rd intel_backlight
}

# 2. Dim screen further to 10% after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = brightnessctl -d intel_backlight set 10%
    on-resume = brightnessctl -rd intel_backlight
}

# 3. Lock screen after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 4. Turn off screens (DPMS) after 16 minutes of inactivity
listener {
    timeout = 960
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5. Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
